<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Apply for Job | CareerConnect</title>
        <link rel="icon" type="image/png" href="images/tab-logo.png">
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
        <link rel="stylesheet" href="nav-bar.css">
        <script src="nav-bar.js" defer></script>
        <link rel="stylesheet" href="profile.css">
        <link rel="stylesheet" href="applications.css">
        <link rel="stylesheet" href="job.css">
    </head>
    <body class="nav-collapsed">
        <div id="navbar-container"></div>

        <section class="job-page-section">
            <div class="job-page-container">
                <nav class="job-back-nav" aria-label="Breadcrumb">
                    <a id="back-link" class="job-back-link" href="jobs.html">
                        <i class="bi bi-arrow-left"></i>
                        <span>Back to job</span>
                    </a>
                </nav>

                <p id="page-message" class="page-message" role="status" hidden></p>
                <button id="retry-job" type="button" class="apply-button" hidden>Retry loading</button>
                <div id="confirmation" class="confirmation" role="status" hidden></div>

                <article id="apply-card" class="job-main-content" hidden>
                    <header class="job-page-header">
                        <h1 id="job-title" class="job-page-title"></h1>
                        <p id="job-subtitle" style="color: #64748b; font-size: 15px; margin-top: 6px; font-weight: 500;"></p>
                    </header>

                    <form id="apply-form" class="apply-form">
                        <h3>Apply for this position</h3>

                        <fieldset class="application-details">
                            <legend>Your details</legend>
                            <div class="application-details-grid">
                                <div class="application-field">
                                    <label for="applicant-first-name">First name</label>
                                    <input type="text" id="applicant-first-name" name="firstName"
                                        maxlength="100" autocomplete="given-name" required>
                                </div>
                                <div class="application-field">
                                    <label for="applicant-last-name">Last name</label>
                                    <input type="text" id="applicant-last-name" name="lastName"
                                        maxlength="100" autocomplete="family-name" required>
                                </div>
                                <div class="application-field">
                                    <label for="applicant-email">Email</label>
                                    <input type="email" id="applicant-email" name="email"
                                        maxlength="255" autocomplete="email" required>
                                </div>
                                <div class="application-field">
                                    <label for="applicant-phone">Phone number (optional)</label>
                                    <input type="tel" id="applicant-phone" name="phone"
                                        maxlength="20" autocomplete="tel">
                                </div>
                                <div class="application-field">
                                    <label for="applicant-address">Address (optional)</label>
                                    <input type="text" id="applicant-address" name="address"
                                        maxlength="255" autocomplete="street-address">
                                </div>
                                <div class="application-field">
                                    <label for="applicant-postal-code">Postal code (optional)</label>
                                    <input type="text" id="applicant-postal-code" name="postalCode"
                                        maxlength="20" autocomplete="postal-code">
                                </div>
                                <div class="application-field">
                                    <label for="applicant-linkedin">LinkedIn profile (optional)</label>
                                    <input type="url" id="applicant-linkedin" name="linkedinUrl"
                                        maxlength="500" placeholder="https://">
                                </div>
                                <div class="application-field">
                                    <label for="applicant-portfolio">Portfolio or work sample (optional)</label>
                                    <input type="url" id="applicant-portfolio" name="portfolioUrl"
                                        maxlength="500" placeholder="https://">
                                </div>
                                <div class="application-field">
                                    <label for="work-authorization">Work authorization (optional)</label>
                                    <select id="work-authorization" name="workAuthorization">
                                        <option value="">Select an option</option>
                                        <option value="authorized_no_sponsorship">Authorized; no sponsorship required</option>
                                        <option value="authorized_sponsorship">Authorized; sponsorship required</option>
                                        <option value="not_authorized">Not currently authorized</option>
                                    </select>
                                </div>
                                <div class="application-field">
                                    <label for="availability-date">Earliest start date (optional)</label>
                                    <input type="date" id="availability-date" name="availabilityDate">
                                </div>
                                <div class="application-field application-field-full">
                                    <label for="salary-min">Salary expectations (optional, CAD per year)</label>
                                    <div class="salary-range">
                                        <input type="number" id="salary-min" name="salaryMin"
                                            min="0" max="9999999999.99" step="0.01"
                                            placeholder="Minimum" aria-label="Minimum salary in CAD">
                                        <span>to</span>
                                        <input type="number" id="salary-max" name="salaryMax"
                                            min="0" max="9999999999.99" step="0.01"
                                            placeholder="Maximum" aria-label="Maximum salary in CAD">
                                    </div>
                                </div>
                                <div class="application-field application-field-full">
                                    <label for="relevant-experience">Relevant experience (optional)</label>
                                    <textarea id="relevant-experience" name="relevantExperience"
                                        maxlength="5000" placeholder="Share a relevant project, skill, or experience."></textarea>
                                </div>
                            </div>
                        </fieldset>

                        <label for="cover-note">Note to the employer (optional)</label>
                        <textarea id="cover-note" name="coverNote" maxlength="2000" placeholder="Share a short note with your application."></textarea>

                        <div class="application-field additional-document">
                            <label for="cover-letter-file">Additional document (optional, e.g. cover letter)</label>
                            <button type="button" id="cover-letter-button" class="document-upload-button">
                                <i class="bi bi-paperclip"></i>
                                Choose document
                            </button>
                            <input type="file" id="cover-letter-file" name="coverLetter"
                                class="visually-hidden" accept=".pdf,.doc,.docx"
                                aria-label="Choose an additional application document">
                            <span id="cover-letter-file-name" class="resume-chosen-name"
                                aria-live="polite"></span>
                            <span class="application-file-hint">PDF, DOC, or DOCX; up to 10 MB</span>
                        </div>

                        <!-- Resume section -->
                        <div class="resume-section" id="resume-section">
                            <p class="resume-section-label" id="resume-section-label">Resume</p>
                            <div class="resume-options" role="group" aria-labelledby="resume-section-label">
                                <!-- Option A: use profile resume (shown only when one exists) -->
                                <button type="button" class="resume-option" id="resume-option-profile"
                                    data-resume-choice="profile" aria-pressed="true" hidden>
                                    <span class="resume-option-body">
                                        <i class="bi bi-file-earmark-person-fill"></i>
                                        <span class="resume-option-text">
                                            <strong>Use my profile resume</strong>
                                            <span id="resume-profile-name" class="resume-file-name"></span>
                                        </span>
                                    </span>
                                </button>

                                <!-- Option B: upload a new file -->
                                <button type="button" class="resume-option" id="resume-option-upload"
                                    data-resume-choice="upload" aria-pressed="false">
                                    <span class="resume-option-body">
                                        <i class="bi bi-upload"></i>
                                        <span class="resume-option-text">
                                            <strong>Upload a new resume</strong>
                                            <span class="resume-file-name">PDF, DOC, or DOCX; up to 10 MB</span>
                                        </span>
                                    </span>
                                </button>
                            </div>

                            <!-- Hidden file picker, shown when "upload" is selected -->
                            <div id="resume-upload-row" class="resume-upload-row" hidden>
                                <input type="file" id="resume-file" name="resume" class="visually-hidden"
                                    accept=".pdf,.docx,.doc"
                                    aria-label="Choose resume file">
                                <span id="resume-file-name-display" class="resume-chosen-name"></span>
                            </div>

                            <p id="resume-hint" class="resume-hint" hidden>
                                No resume on your profile yet.
                                <a href="Profile.html">Upload one to your profile</a> or choose a file below.
                            </p>
                        </div>

                        <p id="apply-error" class="form-error" role="status" hidden></p>
                        <button type="submit" id="apply-button" class="apply-button">Submit Application</button>
                    </form>
                </article>
            </div>
        </section>

        <script src="applications-common.js"></script>
        <script src="storage-config.js"></script>
        <script src="apply.js"></script>
    </body>
</html>
