<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>AI job matches</title>
        <link rel="icon" type="image/png" href="images/tab-logo.png">
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
        <link rel="stylesheet" href="nav-bar.css">
        <script src="nav-bar.js" defer></script>
        <link rel="stylesheet" href="profile.css">
        <link rel="stylesheet" href="applications.css">
        <link rel="stylesheet" href="job-matches.css">
    </head>
    <body class="nav-collapsed job-matches-page">
        <div id="navbar-container"></div>

        <section>
            <span class="header">
                <p><b>AI job matches</b></p>
            </span>
            <p class="match-intro match-callout">
                <i class="bi bi-stars" aria-hidden="true"></i>
                <span>Recommendations compare your skills, experience, education, and preferences with open postings you have not applied to.</span>
            </p>

            <form id="match-form" class="match-form page-width">
                <p id="profile-note" class="match-note match-callout">
                    <i class="bi bi-person-vcard" aria-hidden="true"></i>
                    <span id="profile-note-text">Loading your profile...</span>
                </p>
                <div id="skill-list" class="match-skills"></div>
                <p><a href="Profile.html">Edit skills and resume on your profile</a></p>

                <label for="education">Education</label>
                <textarea id="education" name="education" maxlength="4000" placeholder="Degree, school, or courses"></textarea>

                <label for="experience">Experience</label>
                <textarea id="experience" name="experience" maxlength="8000" placeholder="Roles, projects, or co-op work"></textarea>

                <label for="preferred-job-type">Preferred job type</label>
                <select id="preferred-job-type" name="preferredJobType">
                    <option value="">No preference</option>
                    <option value="Full-time">Full-time</option>
                    <option value="Part-time">Part-time</option>
                    <option value="Contract">Contract</option>
                    <option value="Internship">Internship</option>
                </select>

                <label for="preferred-location">Preferred location</label>
                <input id="preferred-location" name="preferredLocation" type="text" maxlength="255" placeholder="Montreal, remote, or no preference">

                <label for="preferred-category">Preferred category</label>
                <input id="preferred-category" name="preferredCategory" type="text" maxlength="100" placeholder="Software, data, design">

                <label for="preferences-note">Other preferences</label>
                <textarea id="preferences-note" name="preferencesNote" maxlength="2000" placeholder="Schedule, industry, or work style"></textarea>

                <button id="recommend-btn" type="submit">Recommend jobs</button>
            </form>

            <p id="match-message" class="page-message page-width match-callout" role="status" hidden>
                <i class="bi bi-chat-left-text" aria-hidden="true"></i>
                <span id="match-message-text"></span>
            </p>
            <button id="retry-matches" type="button" class="apply-button" hidden>Try again</button>
            <div id="match-results" class="page-width match-results" aria-live="polite" aria-busy="false"></div>
        </section>

        <script src="applications-common.js"></script>
        <script src="job-matches.js"></script>
    </body>
</html>
