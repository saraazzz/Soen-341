<!DOCTYPE html>
<html>
    <head>
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Edit Profile</title>
        <link rel="icon" type="image/png" href="images/tab-logo.png">
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
        <link rel="stylesheet" href="Edit_Profile.css">
    </head>
    <body>
        <div class="page-container">

            <main class="edit-card">
                <div class="card-header">
                    <h1>Edit Profile</h1>

                </div>

                <form class="edit-form">
                    <div class="grid">
                        <div class="field">
                            <label for="firstName">First Name <span class="required">*</span></label>
                            <input type="text" id="firstName" name="firstName" value="">
                        </div>
                        <div class="field">
                            <label for="lastName">Last Name <span class="required">*</span></label>
                            <input type="text" id="lastName" name="lastName" value="">
                        </div>

                        <div class="field">
                            <label for="email">Email Address <span class="required">*</span></label>
                            <input type="email" id="email" name="email" value="">
                        </div>
                        <div class="field">
                            <label for="number">Phone Number</label>
                            <input type="tel" id="number" name="number" value="" placeholder="514-123-4567">
                        </div>

                        <div class="field">
                            <label for="location">Location</label>
                            <input type="text" id="location" name="location" value="">
                        </div>
                        <div class="field">
                            <label for="address">Address</label>
                            <input type="text" id="address" name="address" value="">
                        </div>

                        <div class="field">
                            <label for="postalCode">Postal Code</label>
                            <input type="text" id="postalCode" name="postalCode" value="">
                        </div>
                       
                        <div class="field full">
                            <label for="about">About Me</label>
                            <textarea id="about" name="about"></textarea>
                        </div>
                    </div>

                    <div class="form-actions">
                        <a href="Profile.html" class="btn cancel">Cancel</a>
                        <button type="submit" class="btn save"><i class="bi bi-save"></i> Save Changes</button>
                    </div>
                </form>
            </main>
        </div>
        <script src="Edit_Profile.js"></script>
    </body>
</html>
